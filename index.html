<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bus Ancona</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl/dist/maplibre-gl.js"></script>
<style>
:root{--bg:#eef2f4;--card:#fff;--ink:#12303b;--mute:#5d7580;--line:#d3dde2;--acc:#0e6e7e;--on:#fff;--warn:#8a5200;--warnbg:#fff1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1d24;--card:#15303a;--ink:#e6f0f3;--mute:#93aab3;--line:#264652;--acc:#4fc3d4;--on:#06222a;--warn:#ffc15a;--warnbg:#3b2d0f}}
:root[data-theme="dark"]{--bg:#0d1d24;--card:#15303a;--ink:#e6f0f3;--mute:#93aab3;--line:#264652;--acc:#4fc3d4;--on:#06222a;--warn:#ffc15a;--warnbg:#3b2d0f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Bahnschift,"Segoe UI",system-ui,sans-serif}
.nota{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:14px;margin:8px 0 14px}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px}
.id{display:inline-block;background:var(--acc);color:var(--on);font-weight:700;border-radius:6px;padding:1px 8px;margin-right:6px}
.dir,.mute{color:var(--mute);font-size:14px}
.ore{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px}
.t{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.5px}
.w{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:7px 9px;margin:8px 0 0;font-size:14px}
a{color:var(--acc);font-weight:600}
.btn{margin-top:10px;width:100%;padding:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);border-radius:8px;font:inherit;font-weight:600}
dialog{border:0;border-radius:12px;padding:16px;max-width:92vw;width:440px;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.55)}
dialog button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:8px;background:var(--acc);color:var(--on);font:inherit;font-weight:700}

html,body{height:100%;overflow:hidden}
#map{position:fixed;left:0;right:0;top:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));background:var(--bg)}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:1000}
#bar button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-size:12px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:2px}
#bar button[aria-pressed=true]{color:var(--acc);font-weight:700}
#bar i{font-style:normal;font-size:20px}
#sheet{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));max-height:58vh;overflow:auto;background:var(--bg);border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.3);padding:12px 16px 16px;z-index:999}
#sheet[hidden],#chip[hidden],#imp[hidden],#vista[hidden]{display:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#chiudi{border:0;background:none;color:var(--ink);font-size:22px;padding:4px 8px}
#chip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:10px;right:60px;z-index:900;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:6px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#chip button{margin-left:auto;border:0;background:none;color:var(--ink);font-size:18px}
.row{border-top:1px solid var(--line);padding:10px 0;cursor:pointer}
.card>.row:first-of-type,.card>h3+.row{border-top:0}
.dep{display:flex;align-items:center;gap:10px}
.dep .id{min-width:46px;text-align:center;font-size:17px;padding:5px 8px;border-radius:8px;margin:0;color:#fff}
.mid{flex:1;min-width:0}.dest{font-weight:700;font-size:16px;line-height:1.2}
.next{text-align:right}.next b{display:block;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.next small{color:var(--acc);font-weight:600;font-size:13px}
.alt{margin:4px 0 0 56px;color:var(--mute);font-size:15px;font-variant-numeric:tabular-nums}
h3{margin:0 0 4px;font-size:17px}
.hint{color:var(--mute);font-size:13px;margin:6px 0}
#chip .id{color:#fff;margin:0}
.maplibregl-popup-content{background:var(--card);color:var(--ink);padding:10px 12px;min-width:230px;border-radius:10px}
.maplibregl-popup-anchor-bottom .maplibregl-popup-tip{border-top-color:var(--card)}
.maplibregl-popup-anchor-top .maplibregl-popup-tip{border-bottom-color:var(--card)}
.maplibregl-popup-close-button{color:var(--ink);font-size:20px}
.me{width:18px;height:18px;border-radius:50%;background:#1a73e8;border:3px solid #fff;box-shadow:0 0 0 4px rgba(26,115,232,.25)}
</style>
</head>
<body>
<div id="map"></div>
<div id="chip" hidden></div>
<nav id="bar">
<button data-k="vicino"><i>📍</i>Vicino</button>
<button data-k="fermata"><i>🚏</i>Fermata</button>
<button data-k="linea"><i>🚌</i>Linea</button>
<button data-k="ab"><i>↔️</i>Da A a B</button>
<button data-k="imp"><i>🕐</i>Orario</button>
</nav>
<section id="sheet" hidden>
<div class="sh"><strong id="stit"></strong><button id="chiudi" aria-label="Chiudi">✕</button></div>
<div id="vista"></div>
<div id="imp" hidden><div class="nota" id="nota"></div><label for="per">Tipo di orario</label><select id="per"></select><label for="ora">Da che ora</label><input id="ora" type="time" value="08:00"><button class="btn" id="adesso">Usa l'ora attuale</button><label for="stile">Aspetto della mappa</label><select id="stile"><option value="auto">Automatico (chiaro/scuro)</option><option value="liberty">Standard (con edifici 3D)</option><option value="positron">Chiara minimale</option><option value="bright">Colorata</option><option value="dark">Scura</option></select><p class="hint">Per gli edifici in 3D scegli Standard e tocca il pulsante 3D sulla mappa (si inclina anche con due dita).</p></div>
</section>

<dialog id="pop"><h2 style="margin-top:0">Avvisi sulle tue linee</h2><div id="avv"></div><button id="ok">Ho capito</button></dialog>

<script>
let SAMPLE=true,GEN="",ATT=[],COORD={},MAP=null,mapLine="";
let DATA={
avvisi:[
{titolo:"Esempio: linea 1/4 deviata per lavori in via Torresi",linee:["1/4"],link:"https://www.conerobus.it/articoli/"},
{titolo:"Esempio: sciopero del personale, corse non garantite",linee:["*"],link:"https://www.conerobus.it/articoli/"}],
linee:[
{id:"1/4",dir:"Passetto → Tavernelle",f:[
["Piazza IV Novembre - Passetto",["07.30","08.00","08.30","09.00","09.35","10.10"]],
["Piazza Cavour",["07.35","08.05","08.35","09.05","09.40","10.15"]],
["Piazza Roma",["07.37","08.07","08.37","09.07","09.42","10.17"]],
["Piazza Kennedy - Porto",["07.39","08.09","08.39","09.09","09.44","10.19"]],
["Via Marconi - Parcheggio Archi",["07.43","08.13","08.43","09.13","09.48","10.23"]],
["Stazione FS Centrale",["07.45","08.15","08.45","09.15","09.50","10.25"]],
["Piazza Ugo Bassi",["07.49","08.19","08.49","09.19","09.54","10.29"]],
["Via Tavernelle",["07.54","08.24","08.54","09.24","09.59","10.34"]],
["Tavernelle Capolinea",["07.59","08.29","08.59","09.29","10.04","10.39"]]]},
{id:"30",dir:"Piazza Ugo Bassi → Ospedale Regionale",f:[
["Piazza Ugo Bassi",["05.40","07.45","09.25","11.05","12.45","13.40"]],
["Stazione FS Centrale",["05.44","07.49","09.29","11.09","12.49","13.44"]],
["Torrette - Stazione FS",[null,"07.54","09.34","11.14","12.54","13.49"]],
["Ospedale Regionale",["05.51","08.00","09.40","11.20","13.00","13.55"]]]}
]};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=t=>{const[a,b]=t.split(".");return +a*60+ +b};
const dalle=()=>{const[a,b]=($("#ora").value||"00:00").split(":");return +a*60+ +b};
const has=(n,q)=>n.toLowerCase().includes(q.trim().toLowerCase());
const dopo=(tt,n)=>tt.map((t,i)=>[t,i]).filter(([t])=>t&&mins(t)>=dalle()).slice(0,n);
const hue=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))%360;return h};
const col=id=>`hsl(${hue(id)},62%,40%)`;
const badge=l=>`<span class="id" style="background:${col(l.id)}">${esc(l.id)}</span>`;
const fine=l=>l.dir.split(" → ").pop(), inizio=l=>l.dir.split(" → ")[0];
const hm=t=>t.replace(".",":");
const adesso=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
let oraManuale=false;
const setOra=()=>{const d=new Date();$("#ora").value=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const tra=t=>{if(oraManuale)return"";const m=mins(t)-adesso();return m<=0?"in partenza":m<60?`tra ${m} min`:""};
function warn(l){const a=DATA.avvisi.filter(x=>x.linee.includes(l.id)||x.linee.includes("*"));
 return a.map(x=>`<p class="w">⚠ Non certo: ${esc(x.titolo)}. <a href="${esc(x.link)}" target="_blank" rel="noopener">Vedi la fonte</a></p>`).join("")}
let nomi=[],lista="",IDX={};
function prepara(){IDX={};ATT.forEach(l=>l.f.forEach(st=>(IDX[st[0]]=IDX[st[0]]||[]).push([l,st[1]])));
 nomi=Object.keys(IDX).sort();lista=`<datalist id="fermate">${nomi.map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`}
let tab="",USER=null,drawId=0;const RC={};
const TIT={fermata:"Cerca fermata",linea:"Cerca linea",ab:"Da A a B",vicino:"Vicino a te",imp:"Orario"};
function dep(l,tt,sub){return `<div class="row" data-map="${ATT.indexOf(l)}"><div class="dep">${badge(l)}<div class="mid"><div class="dest">${esc(fine(l))}</div><div class="mute">${sub||"da "+esc(inizio(l))}</div></div>${tt.length?`<div class="next"><b>${hm(tt[0])}</b><small>${tra(tt[0])}</small></div>`:'<div class="next mute">—</div>'}</div>${tt.length>1?`<div class="alt">${tt.slice(1).map(hm).join(" · ")}</div>`:""}${warn(l)}</div>`}
function righe(n,max){const r=(IDX[n]||[]).map(([l,t])=>[l,dopo(t,4).map(x=>x[0])]).sort((a,b)=>(a[1][0]?mins(a[1][0]):9999)-(b[1][0]?mins(b[1][0]):9999));
 return (max?r.slice(0,max):r).map(([l,t])=>dep(l,t)).join("")+(max&&r.length>max?`<p class="hint">+${r.length-max} altre linee</p>`:"")}
function vFermata(){
 $("#vista").innerHTML=`<input id="q" list="fermate" placeholder="Nome della fermata (es. Piazza Roma)" autocomplete="off">${lista}<p class="hint">Tocca una linea per vederne il percorso sulla mappa.</p><div id="r"></div>`;
 const go=()=>{const q=$("#q").value;if(q.trim().length<2){$("#r").innerHTML='<p class="mute">Scrivi almeno due lettere.</p>';return}
  const nm=nomi.filter(n=>has(n,q)).sort((a,b)=>a.length-b.length).slice(0,8);
  $("#r").innerHTML=nm.map(n=>`<div class="card"><h3>${esc(n)}</h3>${righe(n)}</div>`).join("")||'<p class="mute">Nessuna fermata trovata.</p>'};
 $("#q").oninput=go;go()}
function vLinea(){
 $("#vista").innerHTML=`<select id="sl">${ATT.map((l,i)=>`<option value="${i}">${esc(l.id)} · verso ${esc(fine(l))}</option>`).join("")}</select><label for="sf">Fermata</label><select id="sf"></select><p class="hint">Tocca la linea per vedere il percorso sulla mappa.</p><div id="r"></div>`;
 const show=()=>{const l=ATT[$("#sl").value],s=l.f[$("#sf").value];$("#r").innerHTML=`<div class="card">${dep(l,dopo(s[1],6).map(x=>x[0]),esc(s[0]))}</div>`};
 const fill=()=>{const l=ATT[$("#sl").value];$("#sf").innerHTML=l.f.map((s,i)=>`<option value="${i}">${esc(s[0])}</option>`).join("");show()};
 $("#sl").onchange=fill;$("#sf").onchange=show;fill()}
function vAB(){
 $("#vista").innerHTML=`<input id="da" list="fermate" placeholder="Partenza" autocomplete="off"><label for="a"></label><input id="a" list="fermate" placeholder="Arrivo" autocomplete="off">${lista}<p class="hint">Solo bus diretti, senza cambi. Tocca una linea per il percorso.</p><div id="r"></div>`;
 const go=()=>{const A=$("#da").value,B=$("#a").value;if(A.trim().length<2||B.trim().length<2){$("#r").innerHTML="";return}
  let h="";ATT.forEach(l=>{const i=l.f.findIndex(s=>has(s[0],A));if(i<0)return;const j=l.f.findIndex((s,k)=>k>i&&has(s[0],B));if(j<0)return;
   const tr=l.f[i][1].map((t,k)=>[t,l.f[j][1][k]]).filter(([p,r])=>p&&r&&mins(p)>=dalle()).slice(0,4);
   const sub=tr.length?`arrivo ${hm(tr[0][1])} · ${mins(tr[0][1])-mins(tr[0][0])} min`:"nessuna corsa dopo quell'ora";
   h+=`<div class="card">${dep(l,tr.map(x=>x[0]),sub)}</div>`});
  $("#r").innerHTML=h||'<p class="mute">Nessun bus diretto trovato.</p>'};
 $("#da").oninput=go;$("#a").oninput=go;go()}
function vVicino(){
 $("#vista").innerHTML='<p class="mute" id="r">Cerco la tua posizione…</p>';
 const err=t=>{$("#r").textContent=t};
 if(!Object.keys(COORD).length)return err("Le posizioni delle fermate non sono ancora pronte.");
 if(!navigator.geolocation)return err("Posizione non disponibile su questo dispositivo.");
 navigator.geolocation.getCurrentPosition(p=>{const a=p.coords.latitude,b=p.coords.longitude;
  if(MAP){if(USER)USER.remove();const e=document.createElement("div");e.className="me";USER=new maplibregl.Marker({element:e}).setLngLat([b,a]).addTo(MAP);
   MAP.easeTo({center:[b,a],zoom:16,offset:[0,-Math.round(innerHeight*.15)],duration:0})}
  const v=Object.keys(IDX).filter(n=>COORD[n]).map(n=>[n,dist(a,b,COORD[n][0],COORD[n][1])]).sort((x,y)=>x[1]-y[1]).slice(0,4);
  $("#vista").innerHTML='<p class="hint">Tocca una linea per vederne il percorso.</p>'+v.map(([n,d])=>`<div class="card"><div class="mute">a circa ${Math.round(d/10)*10} m</div><h3>${esc(n)}</h3>${righe(n,3)}</div>`).join("")},
  ()=>err("Non riesco a ottenere la posizione: controlla i permessi del browser."),{enableHighAccuracy:true,timeout:15000})}
function render(){
 if(!oraManuale)setOra();
 $("#sheet").hidden=!tab;
 document.querySelectorAll("#bar button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===tab));
 if(!tab)return;
 $("#stit").textContent=TIT[tab];$("#imp").hidden=tab!=="imp";$("#vista").hidden=tab==="imp";
 if(tab==="imp")return;
 ({fermata:vFermata,linea:vLinea,ab:vAB,vicino:vVicino})[tab]()}
function vista(){render()}
const dist=(a,b,c,d)=>{const p=Math.PI/180,x=Math.sin((c-a)*p/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin((d-b)*p/2)**2;return 12742000*Math.asin(Math.sqrt(x))};
function popStop(n){return `<h3>${esc(n)}</h3>`+righe(n,4)}
const STILI={liberty:"https://tiles.openfreemap.org/styles/liberty",positron:"https://tiles.openfreemap.org/styles/positron",dark:"https://tiles.openfreemap.org/styles/dark",bright:"https://tiles.openfreemap.org/styles/bright"};
let PRONTA=false,POP=null,EV=false;
function stileMappa(){let v="auto";try{v=localStorage.getItem("stile2")||"auto"}catch(e){}
 if(v==="auto")v=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"liberty";return STILI[v]||STILI.liberty}
const FC=f=>({type:"FeatureCollection",features:f});
const pt=(n,ev,c)=>({type:"Feature",properties:{name:n,ev:ev?1:0,c:c||"#0e6e7e"},geometry:{type:"Point",coordinates:[COORD[n][1],COORD[n][0]]}});
function setDati(s,l){if(!MAP)return;const a=MAP.getSource("fermate"),b=MAP.getSource("linea");if(a)a.setData(FC(s));if(b)b.setData(FC(l))}
function assicura(){if(!MAP||!MAP.isStyleLoaded()||MAP.getSource("linea"))return;
 MAP.addSource("linea",{type:"geojson",data:FC([])});MAP.addSource("fermate",{type:"geojson",data:FC([])});
 const lay={"line-cap":"round","line-join":"round"};
 MAP.addLayer({id:"linea-ind",type:"line",source:"linea",filter:["==",["get","ind"],1],layout:lay,paint:{"line-color":["get","c"],"line-width":4,"line-dasharray":[2,2],"line-opacity":.85}});
 MAP.addLayer({id:"linea-str",type:"line",source:"linea",filter:["==",["get","ind"],0],layout:lay,paint:{"line-color":["get","c"],"line-width":5.5,"line-opacity":.92}});
 MAP.addLayer({id:"fermate",type:"circle",source:"fermate",paint:{"circle-radius":["case",["==",["get","ev"],1],7,5],"circle-color":["case",["==",["get","ev"],1],["get","c"],"#ffffff"],"circle-stroke-color":["get","c"],"circle-stroke-width":2.5}});
 if(!EV){EV=true;
  MAP.on("click","fermate",e=>{const f=e.features[0];if(POP)POP.remove();POP=new maplibregl.Popup({maxWidth:"300px",offset:10}).setLngLat(f.geometry.coordinates).setHTML(popStop(f.properties.name)).addTo(MAP)});
  MAP.on("mouseenter","fermate",()=>MAP.getCanvas().style.cursor="pointer");MAP.on("mouseleave","fermate",()=>MAP.getCanvas().style.cursor="")}
 PRONTA=true;drawMap()}
class Ctl3D{onAdd(m){const d=document.createElement("div");d.className="maplibregl-ctrl maplibregl-ctrl-group";const b=document.createElement("button");b.type="button";b.textContent="3D";b.style.cssText="font-weight:700;width:29px;height:29px";
 b.onclick=()=>{const p=m.getPitch()>10;m.easeTo({pitch:p?0:60,bearing:p?0:-20,duration:700})};d.appendChild(b);this.d=d;return d}onRemove(){this.d.remove()}}
function initMap(){
 if(!window.maplibregl){$("#map").innerHTML='<p class="mute" style="padding:80px 20px;text-align:center">Impossibile caricare la mappa (serve connessione). Usa il menu in basso per gli orari.</p>';return}
 MAP=new maplibregl.Map({container:"map",style:stileMappa(),center:[13.5189,43.6158],zoom:13,attributionControl:{compact:true}});
 MAP.addControl(new maplibregl.NavigationControl({visualizePitch:true}),"top-right");
 MAP.addControl(new Ctl3D(),"top-right");
 MAP.on("style.load",assicura);MAP.on("styledata",assicura)}
async function percorso(l){const k=l.id+"|"+l.dir+"|"+l.tipo;if(k in RC)return RC[k];
 let pts=l.f.map(x=>COORD[x[0]]).filter(Boolean).filter((p,i,a)=>i===0||p[0]!==a[i-1][0]||p[1]!==a[i-1][1]);
 if(pts.length<2)return RC[k]=null;
 if(pts.length>80)pts=pts.filter((p,i)=>i===pts.length-1||i%Math.ceil(pts.length/80)===0);
 try{const r=await fetch("https://router.project-osrm.org/route/v1/driving/"+pts.map(p=>p[1]+","+p[0]).join(";")+"?overview=full&geometries=geojson");
  const j=await r.json();if(j.routes&&j.routes[0])return RC[k]=j.routes[0].geometry.coordinates}catch(e){}
 return null}
function adatta(pts){if(!pts.length)return;const b=new maplibregl.LngLatBounds(pts[0],pts[0]);pts.forEach(p=>b.extend(p));
 MAP.fitBounds(b,{padding:{top:90,bottom:60,left:30,right:30},duration:600,maxZoom:16})}
async function drawMap(){
 if(!MAP||!PRONTA)return;const my=++drawId,chip=$("#chip");
 if(!Object.keys(COORD).length){chip.hidden=false;chip.innerHTML='<span class="mute">Posizioni delle fermate non ancora pronte. Usa il menu in basso per gli orari.</span>';setDati([],[]);return}
 if(mapLine===""){chip.hidden=true;setDati(Object.keys(IDX).filter(n=>COORD[n]).map(n=>pt(n,false)),[]);return}
 const l=ATT[mapLine],c=col(l.id),m=l.f.filter(x=>!COORD[x[0]]).length;
 const stops=l.f.filter(x=>COORD[x[0]]).map(x=>pt(x[0],true,c)),pts=stops.map(f=>f.geometry.coordinates);
 const riga=(g,ind)=>[{type:"Feature",properties:{c,ind},geometry:{type:"LineString",coordinates:g}}];
 setDati(stops,riga(pts,1));adatta(pts);
 chip.hidden=false;chip.innerHTML=`${badge(l)}<span>verso ${esc(fine(l))}<br><span class="mute" id="rs">Calcolo il percorso…</span></span><button id="x" aria-label="Togli evidenziazione">✕</button>`;

function indovina(tipi){const d=new Date(),m=d.getMonth()+1,g=d.getDate();
 const est=(m>6&&m<9)||(m===6&&g>=8)||(m===9&&g<=14);
 const w=(d.getDay()===0?"Festivo":"Feriale")+" "+(est?"estivo":"invernale");
 return tipi.find(t=>t.startsWith(w))||tipi.find(t=>t.startsWith(w.split(" ")[0]))||tipi[0]}
function applica(){const t=$("#per").value;ATT=DATA.linee.filter(l=>l.tipo===t);prepara();drawMap();render()}
function popup(){if(!DATA.avvisi.length)return;
 $("#avv").innerHTML=DATA.avvisi.map(x=>`<div class="card"><strong>${esc(x.titolo)}</strong><div class="mute">${x.linee.includes("*")?"Tutte le linee":x.linee.length?"Linea "+x.linee.map(esc).join(", "):"Zona delle tue linee"}</div><a href="${esc(x.link)}" target="_blank" rel="noopener">Vedi la fonte</a></div>`).join("");
 $("#pop").showModal()}
async function carica(){
 initMap();
 try{const r=await fetch("data.json",{cache:"no-cache"});if(r.ok){const d=await r.json();if(d.linee&&d.linee.length){DATA.linee=d.linee;SAMPLE=false;GEN=d.generato;COORD=Object.fromEntries(Object.entries(d.fermate||{}).filter(e=>e[1]))}}}catch(e){}
 if(SAMPLE){DATA.linee.forEach(l=>l.tipo="Festivo invernale (esempio)");$("#nota").textContent="Dati di esempio (festivo, solo alcune corse del 2024). Orari di tabella, non in tempo reale."}
 else{try{const r=await fetch("avvisi.json",{cache:"no-cache"});DATA.avvisi=r.ok?(await r.json()).avvisi||[]:[]}catch(e){DATA.avvisi=[]}
  const n=new Date();
  $("#nota").innerHTML="Orari di tabella aggiornati il "+esc(GEN)+". Non in tempo reale. <a href=\"report.txt\">Stato dati</a>"}
 const tipi=[...new Set(DATA.linee.map(l=>l.tipo))];
 $("#per").innerHTML=tipi.map(t=>`<option>${esc(t)}</option>`).join("");$("#per").value=indovina(tipi);$("#per").onchange=applica;
 $("#ok").onclick=()=>$("#pop").close();
 applica();popup()}
carica();
