name: Aggiorna orari e avvisi

on:
  schedule:
    - cron: "15 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - run: python aggiorna.py
      - name: Salva i dati
        if: always()
        run: |
          git config user.email "aggiornamento@users.noreply.github.com"
          git config user.name "aggiornamento"
          git add -A
          git commit -m "aggiorna dati" || echo "niente da salvare"
          git push
